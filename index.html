<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Docsify Starter</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta
      name="description"
      content="Docsify Starter：一个无需构建、支持中英文切换的 Docsify v5 文档站点模板。"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="_media/favicon.svg" />

    <!-- Docsify v5 核心主题 -->
    <link rel="stylesheet" href="_style/docsify@5-themes-core.min.css" />
    <!-- 深色模式附加样式：默认跟随系统，可用右下角按钮手动切换 -->
    <link
      id="theme-dark"
      rel="stylesheet"
      href="_style/docsify@5-themes-core-dark.min.css"
      media="(prefers-color-scheme: dark)"
    />
    <!-- 自定义样式（右下角主题按钮） -->
    <link rel="stylesheet" href="_style/custom.css" />

    <script>
      // 首屏渲染前恢复上次选择的主题，避免闪烁；没有记录时跟随系统
      (() => {
        try {
          const saved = localStorage.getItem('docsify-theme');
          if (saved === 'dark' || saved === 'light') {
            document.getElementById('theme-dark').media =
              saved === 'dark' ? 'all' : 'not all';
            document.documentElement.dataset.theme = saved;
          }
        } catch (error) {
          /* localStorage 不可用时忽略 */
        }
      })();
    </script>
  </head>

  <body class="loading sidebar-chevron-right">
    <div id="app"></div>

    <!-- 右下角悬浮控件（由脚本填充） -->
    <div id="app-controls" class="app-controls"></div>

    <script>
      window.$docsify = {
        // 站点名称，显示在侧边栏顶部
        name: 'Docsify Starter',
        nameLink: {
          '/en/': '#/en/',
          '/': '#/',
        },

        // GitHub 仓库：填写完整 URL 后显示右上角角标；留空则不显示
        // repo: 'https://github.com/your-name/your-repo',
        repo: '',

        // 侧边栏：加载同目录的 _sidebar.md；subMaxLevel 控制页面内标题的显示层级
        loadSidebar: '_sidebar.md',
        subMaxLevel: 3,
        maxLevel: 4,

        // 顶部导航：加载同目录的 _navbar.md
        loadNavbar: '_navbar.md',

        // 封面页：按语言加载（值相对于当前语言目录）
        coverpage: {
          '/en/': '_coverpage.md',
          '/': '_coverpage.md',
        },
        // 只显示封面，不在封面下方渲染首页正文
        onlyCover: false,

        // 访问不存在的页面时，按语言加载 404 内容
        notFoundPage: {
          '/en/': 'en/_404.md',
          '/': '_404.md',
        },

        // 英文页面缺失时回退到中文同名页面；不需要可删除
        fallbackLanguages: ['en'],

        // 切换页面后自动回到顶部
        auto2top: true,

        // 无障碍“跳到主要内容”链接，按语言显示
        skipLink: {
          '/en/': 'Skip to main content',
          '/': '跳到主要内容',
        },

        // 全文搜索（对应 _script/docsify-search@5.min.js）
        search: {
          placeholder: {
            '/en/': 'Search',
            '/': '搜索',
          },
          paths: 'auto',
          depth: 2,
        },

        // 上一节 / 下一节（对应 _script/docsify-pagination@2.10.1.min.js）
        pagination: {
          previousText: {
            '/en/': 'Previous',
            '/': '上一节',
          },
          nextText: {
            '/en/': 'Next',
            '/': '下一节',
          },
          crossChapter: true,
          crossChapterText: true,
        },

        // 微信公众号二维码（可选）：填写 qrcode 后显示右下角按钮；不填则不显示
        // wechat: {
        //   qrcode: '_media/wechat-qrcode.png',
        //   text: '微信扫码　关注公众号',
        // },
      };
    </script>

    <!-- Docsify v5.0.0 本体（必须最先加载） -->
    <script src="_script/docsify@5.min.js"></script>
    <!-- 全文搜索插件 -->
    <script src="_script/docsify-search@5.min.js"></script>
    <!-- 分页插件 -->
    <script src="_script/docsify-pagination@2.10.1.min.js"></script>
    <!-- 中英文切换（右下角「中 / EN」按钮） -->
    <script src="_script/language-toggle.js"></script>
    <!-- 深色模式切换（右下角按钮，双击恢复跟随系统） -->
    <script src="_script/theme-toggle.js"></script>
    <!-- 可选微信公众号二维码（填写 $docsify.wechat 后生效） -->
    <script src="_script/wechat.js"></script>
  </body>
</html>
